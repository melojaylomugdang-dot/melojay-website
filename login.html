
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to My Website | Melojay</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ffaddd;
    --cyan: #82f5f5;
    --purple: #c5a1ff;
    --text: #fff6ff;
    --muted: #cbbddd;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 10% 15%, rgba(159, 57, 135, .48), transparent 40%),
        radial-gradient(ellipse at 100% 100%, rgba(24, 105, 173, .4), transparent 42%),
        linear-gradient(135deg, #100d2b, #241238 55%, #111a3a);
}

/* Soft background glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle at center,
        transparent 30%,
        rgba(5, 5, 25, .2) 100%
    );
    z-index: 0;
}

/* Falling individual sakura petals */
#sakura {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

/* Compact glass login box */
.login-card {
    position: relative;
    z-index: 2;
    width: min(360px, 92vw);
    padding: 30px 27px 24px;
    text-align: center;
    border: 1px solid rgba(255, 173, 221, .38);
    border-radius: 22px;
    background: rgba(23, 15, 48, .78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
        0 0 30px rgba(255, 91, 190, .12),
        0 15px 40px rgba(0, 0, 0, .2),
        inset 0 0 22px rgba(190, 151, 255, .045);
    animation: appear .7s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.logo {
    width: 57px;
    height: 57px;
    margin: 0 auto 15px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 27px;
    color: cyan;
    background: linear-gradient(
        135deg,
        rgba(255, 173, 221, .25),
        rgba(130, 245, 245, .13)
    );
    border: 1px solid rgba(255, 173, 221, .45);
    box-shadow: 0 0 20px rgba(255, 134, 210, .12);
}

h1 {
    color: #ffe1f4;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: .5px;
    margin-bottom: 7px;
}

.subtitle {
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 23px;
}

.input-box {
    margin-bottom: 14px;
    text-align: left;
}

.input-box label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: cyan;
}

.input-box input {
    width: 100%;
    padding: 12px 13px;
    border-radius: 11px;
    outline: none;
    border: 1px solid rgba(220, 183, 255, .23);
    background: rgba(255, 255, 255, .055);
    color: cyan;
    font-family: inherit;
    font-size: 14px;
    transition: border-color .25s, box-shadow .25s, background .25s;
}

.input-box input::placeholder {
    color: #a99ab9;
}

.input-box input:focus {
    border-color: var(--pink);
    background: rgba(255, 255, 255, .08);
    box-shadow: 0 0 12px rgba(255, 145, 210, .12);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 67px;
}

.show-password {
    position: absolute;
    top: 50%;
    right: 11px;
    transform: translateY(-50%);
    color: var(--cyan);
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
}

.show-password:hover {
    color: cyan;
}

.remember-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin: 1px 0 17px;
    color: var(--muted);
    font-size: 12px;
}

.remember-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

.remember-row input {
    accent-color: #ed8fc9;
}

.text-link {
    color: var(--cyan);
    text-decoration: none;
    cursor: pointer;
}

.text-link:hover {
    color: var(--pink);
    text-decoration: underline;
}

.submit-button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(
        100deg,
        #f5b6e0,
        #c6a7ff,
        #91e8f4
    );
    color: #211334;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .7px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(202, 146, 255, .12);
    transition: transform .25s, box-shadow .25s, filter .25s;
}

.submit-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.07);
    box-shadow: 0 8px 20px rgba(218, 143, 255, .2);
}

.switch-text {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
}

#error,
.form-message {
    min-height: 17px;
    margin-top: 11px;
    font-size: 12px;
    color: #ff9fcf;
    overflow-wrap: anywhere;
}

.footer {
    margin-top: 19px;
    padding-top: 13px;
    border-top: 1px solid rgba(255, 255, 255, .09);
    font-size: 11px;
    color: #a99bbd;
    letter-spacing: .3px;
}

.hidden {
    display: none !important;
}

@media (max-width: 420px) {
    .login-card {
        padding: 26px 21px 21px;
    }

    h1 {
        font-size: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<canvas id="sakura" aria-hidden="true"></canvas>

<main class="login-card">
    <div class="logo" aria-hidden="true">✧</div>

    <!-- LOGIN SECTION -->
    <section id="loginSection">
        <h1>WELCOME TO MY WEBSITE</h1>

        <p class="subtitle">
            Welcome to my little universe.<br>
            Please log in to continue.
        </p>

        <form id="loginForm">
            <div class="input-box">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-box">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="show-password"
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >Show</button>
                </div>
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a class="text-link" href="#" id="forgotLink">
                    Forgot password?
                </a>
            </div>

            <button class="submit-button" type="submit">
                LOG IN
            </button>

            <p id="loginError" class="form-message" role="alert"></p>
        </form>

        <p class="switch-text">
            Don't have an account?
            <a class="text-link" href="#" id="showSignup">Sign up</a>
        </p>
    </section>

    <!-- SIGN-UP SECTION -->
    <section id="signupSection" class="hidden">
        <h1>CREATE YOUR ACCOUNT</h1>

        <p class="subtitle">
            Create your own little place in my universe.
        </p>

        <form id="signupForm">
            <div class="input-box">
                <label for="newUsername">Choose a username</label>
                <input
                    type="text"
                    id="newUsername"
                    placeholder="Create a username"
                    autocomplete="username"
                    minlength="3"
                    required
                >
            </div>

            <div class="input-box">
                <label for="newPassword">Create a password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        class="show-password"
                        type="button"
                        id="toggleNewPassword"
                        aria-label="Show password"
                    >Show</button>
                </div>
            </div>

            <div class="input-box">
                <label for="confirmPassword">Confirm password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button class="submit-button" type="submit">
                SIGN UP
            </button>

            <p id="signupError" class="form-message" role="alert"></p>
        </form>

        <p class="switch-text">
            Already have an account?
            <a class="text-link" href="#" id="showLogin">Log in</a>
        </p>
    </section>

    <p class="footer">✧ A little universe by Melojay ✧</p>
</main>

<script>
/* =====================================
   LOGIN AND SIGN-UP DEMO
   ===================================== */

const loginSection = document.getElementById("loginSection");
const signupSection = document.getElementById("signupSection");

const loginError = document.getElementById("loginError");
const signupError = document.getElementById("signupError");

/* Switch to sign-up */
document.getElementById("showSignup").addEventListener("click", function(e) {
    e.preventDefault();

    loginSection.classList.add("hidden");
    signupSection.classList.remove("hidden");

    loginError.textContent = "";
    signupError.textContent = "";
});

/* Switch back to login */
document.getElementById("showLogin").addEventListener("click", function(e) {
    e.preventDefault();

    signupSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    loginError.textContent = "";
    signupError.textContent = "";
});

/* Show/hide password */
function setupPasswordToggle(inputId, buttonId) {
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);

    button.addEventListener("click", function() {
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";

        button.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
    });
}

setupPasswordToggle("password", "togglePassword");
setupPasswordToggle("newPassword", "toggleNewPassword");

/* Demo forgot-password message */
document.getElementById("forgotLink").addEventListener("click", function(e) {
    e.preventDefault();

    loginError.textContent =
        "Password recovery is not configured. Please contact the website administrator.";
});

/*
  DEMO ACCOUNT STORAGE

  This is a front-end demonstration only.
  It is not secure authentication for a published website.
  Do not use real or sensitive passwords here.
*/

function getAccounts() {
    try {
        return JSON.parse(
            localStorage.getItem("sakuraDemoAccounts") || "{}"
        );
    } catch (error) {
        return {};
    }
}

/* Register a new demo account */
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username =
        document.getElementById("newUsername").value.trim();

    const password =
        document.getElementById("newPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    signupError.textContent = "";

    if (username.length < 3) {
        signupError.textContent =
            "Your username must contain at least 3 characters.";
        return;
    }

    if (password.length < 8) {
        signupError.textContent =
            "Please use a password with at least 8 characters.";
        return;
    }

    if (password !== confirm) {
        signupError.textContent =
            "Your passwords do not match.";
        return;
    }

    const accounts = getAccounts();

    if (
        Object.prototype.hasOwnProperty.call(accounts, username)
    ) {
        signupError.textContent =
            "That username already exists. Please choose another.";
        return;
    }

    try {
        accounts[username] = password;

        localStorage.setItem(
            "sakuraDemoAccounts",
            JSON.stringify(accounts)
        );

        document.getElementById("username").value = username;
        document.getElementById("password").value = "";

        signupSection.classList.add("hidden");
        loginSection.classList.remove("hidden");

        loginError.textContent =
            "Demo account created! Please log in.";

        signupError.textContent = "";
        document.getElementById("signupForm").reset();

    } catch (error) {
        signupError.textContent =
            "Could not save the account in this browser.";
    }
});

/* Login and redirect to index.html */
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    loginError.textContent = "";

    /*
      Optional demo administrator account:
      Username: Melojay
      Password: Sakura2026!

      Change these demo credentials before using the page.
      This is not secure authentication.
    */

    const isDemoAdmin =
        username === "Melojay" &&
        password === "Sakura2026!";

    const accounts = getAccounts();

    const isRegisteredUser =
        Object.prototype.hasOwnProperty.call(accounts, username) &&
        accounts[username] === password;

    if (isDemoAdmin || isRegisteredUser) {
        loginError.textContent =
            "Login successful! Opening your website...";

        /*
          IMPORTANT:
          index.html must be in the same folder as login.html.
        */
        window.location.href = "index.html";

    } else {
        loginError.textContent =
            "Incorrect username or password. Please try again.";
    }
});


/* =====================================
   FALLING INDIVIDUAL SAKURA PETALS
   No whole flowers are drawn.
   ===================================== */

const canvas = document.getElementById("sakura");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;
let petals = [];

function createPetal(randomStart = false) {
    return {
        x: Math.random() * width,
        y: randomStart ? Math.random() * height : -20,

        size: 3.5 + Math.random() * 5,

        speed: 0.55 + Math.random() * 1.1,
        drift: -0.35 + Math.random() * 0.7,

        angle: Math.random() * Math.PI * 2,
        spin: -0.018 + Math.random() * 0.036,

        sway: Math.random() * Math.PI * 2,
        swaySpeed: 0.008 + Math.random() * 0.016,

        opacity: 0.4 + Math.random() * 0.48,
        shade: Math.random()
    };
}

function resizeCanvas() {
    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* A moderate number of petals */
    const count = Math.min(
        65,
        Math.max(22, Math.floor(width / 24))
    );

    petals = Array.from(
        { length: count },
        () => createPetal(true)
    );
}

function drawPetal(p) {
    ctx.save();

    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.opacity;

    const s = p.size;

    /* Pink gradient for a soft 3D appearance */
    const gradient = ctx.createLinearGradient(
        -s, -s, s, s
    );

    gradient.addColorStop(0, "#fff0fb");

    gradient.addColorStop(
        0.38,
        p.shade > 0.5 ? "#ffb8df" : "#ed8bc6"
    );

    gradient.addColorStop(1, "#b95baf");

    ctx.fillStyle = gradient;
    ctx.shadowColor = "rgba(255, 144, 213, 0.32)";
    ctx.shadowBlur = 4;

    /* Draw one curved sakura petal */
    ctx.beginPath();

    ctx.moveTo(0, -s * 0.95);

    ctx.bezierCurveTo(
        s * 1.0, -s * 0.75,
        s * 1.0, s * 0.35,
        s * 0.05, s
    );

    ctx.bezierCurveTo(
        -s * 0.8, s * 0.45,
        -s * 0.85, -s * 0.55,
        0, -s * 0.95
    );

    ctx.closePath();
    ctx.fill();

    /* Subtle highlight */
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255, 245, 255, 0.28)";
    ctx.lineWidth = 0.6;

    ctx.beginPath();
    ctx.moveTo(0, -s * 0.55);

    ctx.quadraticCurveTo(
        s * 0.1, 0,
        0, s * 0.65
    );

    ctx.stroke();

    ctx.restore();
}

function animateSakura() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < petals.length; i++) {
        const p = petals[i];

        p.y += p.speed;
        p.sway += p.swaySpeed;

        p.x += p.drift + Math.sin(p.sway) * 0.35;
        p.angle += p.spin;

        drawPetal(p);

        if (
            p.y > height + 25 ||
            p.x < -30 ||
            p.x > width + 30
        ) {
            petals[i] = createPetal();
        }
    }

    requestAnimationFrame(animateSakura);
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
animateSakura();
</script>

</body>
</html>
